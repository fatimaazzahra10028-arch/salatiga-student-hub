<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Salatiga Student Hub: panduan mahasiswa baru UIN Salatiga. Alur registrasi sampai KRS, fakultas dan prodi, UKT dan beasiswa, serta info hidup di Salatiga.">
    <title>Salatiga Student Hub - Panduan Mahasiswa Baru UIN Salatiga</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">

    <!-- Terapkan tema gelap lebih awal agar tidak berkedip saat halaman dimuat -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    
    <!-- FONTS & ICONS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ANIMATE ON SCROLL (AOS) CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />

    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 400: '#34d399', 500: '#10b981', 600: '#059669' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col relative overflow-x-hidden">

    <noscript>
        <div style="padding:2rem;text-align:center;font-family:sans-serif">Website ini membutuhkan JavaScript. Silakan aktifkan JavaScript di browser Anda.</div>
    </noscript>

    <!-- GLOBAL ANIMATED BACKGROUND -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <!-- Pattern Pola Grid Halus Universal -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px]"></div>
        
        <!-- Blob 1: Emerald (Pojok Kiri Atas) -->
        <div class="absolute -top-24 -left-20 w-72 h-72 sm:w-96 sm:h-96 bg-emerald-400/20 dark:bg-emerald-500/15 rounded-full blur-3xl animate-[pulse_6s_ease-in-out_infinite]"></div>
        
        <!-- Blob 2: Teal/Cyan (Tengah Kanan) -->
        <div class="absolute top-1/3 -right-20 w-80 h-80 sm:w-[450px] sm:h-[450px] bg-teal-400/20 dark:bg-teal-500/15 rounded-full blur-3xl animate-[ping_8s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
        
        <!-- Blob 3: Amber Subtle (Bawah Kiri) -->
        <div class="absolute top-2/3 -left-32 w-80 h-80 sm:w-[500px] sm:h-[500px] bg-amber-300/15 dark:bg-emerald-600/10 rounded-full blur-3xl"></div>
    </div>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="relative z-10 flex flex-col min-h-screen">
        <div data-component="components/navbar.html"></div>
        <div data-component="components/hero.html"></div>
        <div data-component="components/about.html"></div>
        <div data-component="components/alur-maba.html"></div>
        <div data-component="components/fakultas.html"></div>
        <div data-component="components/campus-map.html"></div>
        <div data-component="components/ukt-beasiswa.html"></div>
        <div data-component="components/directory.html"></div>
        <div data-component="components/faq.html"></div>
        <div data-component="components/contact.html"></div>
        <div data-component="components/footer.html"></div>
        <div data-component="components/modals.html"></div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
