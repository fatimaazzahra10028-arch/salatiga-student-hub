<!-- FITUR 1: MODAL DETAIL INFORMASI FULLSCREEN -->
<div id="detailModal" role="dialog" aria-modal="true" aria-label="Detail informasi" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/70 dark:bg-slate-950/85 backdrop-blur-md transition-all duration-300">
    <div class="min-h-screen w-full flex flex-col justify-between bg-slate-50/90 dark:bg-slate-900/90 text-slate-800 dark:text-slate-100 backdrop-blur-xl relative overflow-hidden">
        <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <div class="absolute -top-24 -left-20 w-72 h-72 sm:w-96 sm:h-96 bg-emerald-400/10 dark:bg-emerald-500/10 rounded-full blur-3xl animate-[pulse_6s_ease-in-out_infinite]"></div>
            <div class="absolute top-1/2 -right-20 w-80 h-80 sm:w-[450px] sm:h-[450px] bg-teal-400/10 dark:bg-teal-500/10 rounded-full blur-3xl"></div>
        </div>
        <div id="modalContent" class="w-full min-h-screen flex flex-col relative z-10"></div>
    </div>
</div>

<!-- FITUR 2: DRAWER FAVORIT -->
<div id="bookmarkDrawer" class="hidden fixed inset-y-0 right-0 z-50 w-full sm:w-96 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl shadow-2xl border-l border-slate-200/80 dark:border-slate-800/80 transform translate-x-full transition-transform duration-300 ease-in-out p-5 sm:p-6 flex flex-col">
    <div class="flex items-center justify-between pb-4 border-b border-slate-200/80 dark:border-slate-800/80 mb-4 shrink-0">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm shadow-inner">
                <i class="fa-solid fa-bookmark"></i>
            </div>
            <div>
                <h3 class="font-extrabold text-base sm:text-lg text-slate-900 dark:text-white leading-tight">Simpanan Saya</h3>
                <span class="text-[10px] font-semibold text-slate-400">Item &amp; Informasi Tersimpan</span>
            </div>
        </div>
        <button id="closeDrawerBtn" aria-label="Tutup simpanan" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex items-center justify-center">
            <i class="fa-solid fa-xmark text-base"></i>
        </button>
    </div>
    <div id="bookmarkHeaderActions" class="mb-3 hidden shrink-0">
        <button onclick="clearAllBookmarks()" class="w-full bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 text-xs font-bold py-2.5 px-3 rounded-xl border border-rose-200/80 dark:border-rose-900/50 flex items-center justify-center gap-2 transition-all shadow-sm active:scale-[0.99]">
            <i class="fa-solid fa-trash-can text-xs"></i>
            <span>Hapus Semua Simpanan</span>
        </button>
    </div>
    <div id="bookmarkList" class="flex-grow overflow-y-auto space-y-3 pr-1 no-scrollbar"></div>
</div>

<!-- FITUR 3: FLOATING BACK TO TOP BUTTON -->
<button id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Kembali ke atas" class="fixed bottom-6 right-6 z-40 hidden w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-emerald-500 hover:from-emerald-700 hover:to-emerald-600 text-white shadow-xl shadow-emerald-600/30 border border-emerald-400/30 flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95 group">
    <i class="fa-solid fa-arrow-up text-sm sm:text-base transition-transform group-hover:-translate-y-0.5"></i>
</button>

<!-- FITUR 4: TOAST NOTIFICATION CONTAINER -->
<div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 sm:left-6 sm:translate-x-0 z-50 pointer-events-none flex flex-col gap-2.5 max-w-sm w-full px-4 sm:px-0"></div>
